<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>フットボール・ソウル ～ココロで育てるサッカー育成譚～</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch:#2e8b3d; --pitch2:#1d6b2c; --line:#bdeacb;
    --ink:#15162a; --paper:#f6f4e2; --gold:#ffcc33; --accent:#3ddc62;
    --danger:#e23a3a; --stress:#ff8a3a; --moti:#ffd23f; --conf:#3a8de2; --focus:#9a5cff;
    --card:#f6f4e2; --shadow:4px 4px 0 rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  img.spr,canvas.spr{image-rendering:pixelated;image-rendering:crisp-edges;display:block;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"DotGothic16","Hiragino Kaku Gothic ProN",Meiryo,monospace;
    color:var(--ink);
    background:
      repeating-linear-gradient(0deg, #1d6b2c 0 22px, #257a34 22px 44px) fixed;
    min-height:100vh; -webkit-text-size-adjust:100%;
  }
  /* 走査線オーバーレイ */
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:99;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.10) 0 2px, transparent 2px 4px);
    mix-blend-mode:multiply;}
  .pixfont{font-family:"Press Start 2P","DotGothic16",monospace;}
  #app{max-width:520px;margin:0 auto;padding:14px 14px 60px;position:relative;z-index:1;}

  .topbar{display:flex;align-items:center;justify-content:space-between;color:#fff;margin-bottom:12px;
    text-shadow:2px 2px 0 #0a2913;}
  .topbar .logo{font-weight:400;font-size:14px;line-height:1.5;}
  .topbar .logo small{display:block;font-size:9px;opacity:.9;margin-top:3px;}
  .meta{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  .pill{background:var(--ink);border:2px solid #000;color:#fff;
    padding:4px 8px;font-size:10px;font-weight:400;box-shadow:2px 2px 0 rgba(0,0,0,.4);}

  .panel{background:var(--card);border:3px solid var(--ink);box-shadow:var(--shadow);padding:14px;margin-bottom:14px;}
  h2.section{font-size:12px;margin:0 0 12px;color:var(--ink);
    display:flex;align-items:center;gap:7px;border-bottom:3px dashed #c9c5a0;padding-bottom:8px;}
  h2.section::before{content:"";width:10px;height:10px;background:var(--accent);box-shadow:2px 2px 0 #1d6b2c;}

  /* ====== タイトル ====== */
  .title-hero{text-align:center;color:#fff;padding:18px 6px 6px;text-shadow:3px 3px 0 #0a2913;}
  .title-hero .ball{display:inline-block;animation:floaty 1.2s steps(2) infinite;}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .title-hero h1{font-size:18px;line-height:1.6;margin:10px 0 2px;}
  .title-hero p{font-size:11px;line-height:1.7;margin:10px 16px 0;}
  .concept{background:var(--ink);border:3px solid #000;
    padding:13px 14px;margin:16px 2px;color:#eafff1;font-size:11px;line-height:1.9;text-align:left;
    box-shadow:var(--shadow);}
  .concept b{color:var(--gold);}

  /* ====== ボタン ====== */
  .btn{display:block;width:100%;border:3px solid var(--ink);padding:14px;font-size:13px;font-weight:400;
    font-family:inherit;color:var(--ink);background:var(--gold);cursor:pointer;
    box-shadow:4px 4px 0 #000;transition:transform .04s, box-shadow .04s;}
  .btn:active{transform:translate(4px,4px);box-shadow:0 0 0 #000;}
  .btn.alt{background:var(--accent);color:#06331a;}
  .btn.ghost{background:#d9d6bd;color:var(--ink);}
  .btn:disabled{filter:grayscale(.6) opacity(.55);pointer-events:none;}

  .field{margin:11px 0;}
  .field label{display:block;font-size:11px;font-weight:400;color:var(--ink);margin-bottom:6px;}
  .field input,.field select{width:100%;padding:11px;border:3px solid var(--ink);
    font-size:14px;font-family:inherit;background:#fffef2;}
  .field input:focus,.field select:focus{outline:none;border-color:var(--accent);}

  /* ====== 選手カード ====== */
  .pcard{position:relative;color:#fff;margin-bottom:14px;
    background:#16324a;border:3px solid #000;box-shadow:var(--shadow);}
  .pcard .shine{display:none;}
  .pcard .head{display:flex;align-items:center;gap:12px;padding:12px 14px 8px;}
  .pcard .face{width:60px;height:64px;display:flex;align-items:center;justify-content:center;
    background:#0d1f2e;border:3px solid #000;flex:0 0 auto;
    background-image:repeating-linear-gradient(0deg,#0d1f2e 0 6px,#11283b 6px 12px);}
  .pcard .who{flex:1;min-width:0;}
  .pcard .who .nm{font-size:16px;font-weight:400;}
  .pcard .who .sub{font-size:10px;opacity:.9;margin-top:4px;line-height:1.5;}
  .pcard .ovr{text-align:center;flex:0 0 auto;border:3px solid #000;background:#0d1f2e;padding:4px 8px;}
  .pcard .ovr b{font-size:24px;font-weight:400;line-height:1;color:var(--gold);font-family:"Press Start 2P",monospace;}
  .pcard .ovr span{display:block;font-size:8px;opacity:.8;margin-top:4px;}
  .ptags{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 14px;}
  .ptag{font-size:9.5px;font-weight:400;background:#0d1f2e;border:2px solid #000;
    padding:4px 7px;}
  .ptag.gold{background:#5a4a12;color:var(--gold);}

  /* ====== ステータスバー（ドット分割） ====== */
  .stat{margin-bottom:10px;}
  .stat .row{display:flex;justify-content:space-between;font-size:10.5px;font-weight:400;margin-bottom:4px;color:var(--ink);}
  .stat .row .v{font-variant-numeric:tabular-nums;}
  .bar{position:relative;height:12px;background:#c9c5a0;border:2px solid var(--ink);overflow:hidden;}
  .bar>i{display:block;height:100%;background:var(--accent);transition:width .35s steps(8);}
  .bar::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(90deg, transparent 0 4px, var(--card) 4px 6px);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;}

  /* ====== メンタルゲージ ====== */
  .mentals{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .mg{background:#ece4c2;border:2px solid var(--ink);padding:8px 9px;}
  .mg .t{font-size:10px;font-weight:400;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .mg .t em{font-style:normal;font-size:12px;font-variant-numeric:tabular-nums;}
  .mg .bar{height:10px;}
  .mg.moti .bar>i{background:var(--moti);}
  .mg.conf .bar>i{background:var(--conf);}
  .mg.focus .bar>i{background:var(--focus);}
  .mg.stress .bar>i{background:var(--stress);}
  .mg .bar::after{background:repeating-linear-gradient(90deg, transparent 0 4px, #ece4c2 4px 6px);}

  .multiplier{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;
    font-size:11px;font-weight:400;color:var(--ink);background:#ece4c2;border:2px solid var(--ink);padding:9px;cursor:pointer;}
  .multiplier b{font-size:18px;color:#1d6b2c;font-family:"Press Start 2P",monospace;}
  .multiplier .q{margin-left:auto;width:18px;height:18px;background:var(--accent);color:#06331a;border:2px solid var(--ink);
    display:inline-flex;align-items:center;justify-content:center;font-size:11px;}

  /* 選手の本音バブル */
  .bubble{display:flex;gap:10px;align-items:center;background:#fffef2;
    border:3px solid var(--ink);padding:11px 13px;margin-bottom:14px;box-shadow:var(--shadow);}
  .bubble .av{flex:0 0 auto;}
  .bubble .bd{flex:1;min-width:0;}
  .bubble .bd .lbl{font-size:9px;font-weight:400;color:#b07d00;}
  .bubble .bd .msg{font-size:12.5px;font-weight:400;color:var(--ink);margin-top:4px;line-height:1.6;}

  /* 予想プレビュー */
  .preview{background:var(--ink);color:#cdeed8;border:3px solid #000;padding:11px 13px;margin:12px 0 0;font-size:11px;line-height:1.8;}
  .preview .ttl{font-size:9px;color:#8fb6a1;margin-bottom:5px;}
  .preview .gain{color:var(--gold);font-weight:400;}
  .preview .up{color:#74f0a3;} .preview .dn{color:#ff9b9b;}
  .preview .warn{color:#ffd98a;}
  .preview .empty{color:#7a9a88;}

  /* ====== 選択肢 ====== */
  .choices{display:grid;gap:8px;}
  .choice{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:3px solid var(--ink);
    background:#fffef2;padding:10px;cursor:pointer;transition:transform .04s;font-family:inherit;
    box-shadow:3px 3px 0 rgba(0,0,0,.25);}
  .choice:active{transform:translate(3px,3px);box-shadow:0 0 0;}
  .choice.sel{background:#d6f3df;border-color:#1d6b2c;box-shadow:3px 3px 0 #1d6b2c;}
  .choice .ico{width:38px;height:38px;display:flex;align-items:center;justify-content:center;
    font-size:20px;background:#ece4c2;border:2px solid var(--ink);flex:0 0 auto;}
  .choice .tx{flex:1;min-width:0;}
  .choice .tx .h{font-size:12.5px;font-weight:400;}
  .choice .tx .d{font-size:10px;color:#6a6a55;margin-top:3px;line-height:1.4;}
  .choice .tag{font-size:9px;font-weight:400;padding:2px 5px;border:1px solid var(--ink);background:#ece4c2;}

  /* ====== ログ / 実況 ====== */
  .log{background:#0d1f16;color:#cdeed8;border:3px solid #000;padding:11px 13px;font-size:11px;line-height:1.8;
    max-height:230px;overflow-y:auto;}
  .log p{margin:0 0 7px;}
  .log .gain{color:var(--gold);} .log .good{color:#74f0a3;}
  .log .bad{color:#ff9b9b;} .log .ev{color:#ffd98a;} .log .sys{color:#8fb6a1;}

  /* 試合実況 */
  .matchscene{text-align:center;color:#fff;}
  .scoreboard{display:flex;align-items:center;justify-content:center;gap:12px;margin:6px 0 14px;
    background:#16324a;border:3px solid #000;padding:14px;box-shadow:var(--shadow);}
  .scoreboard .tm{flex:1;font-size:11px;font-weight:400;}
  .scoreboard .sc{font-size:30px;font-weight:400;font-family:"Press Start 2P",monospace;}
  .scoreboard .sc small{font-size:13px;opacity:.6;}

  /* トースト */
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(40px);
    background:var(--ink);color:#fff;padding:11px 16px;border:3px solid #000;font-size:12px;font-weight:400;
    box-shadow:var(--shadow);opacity:0;transition:.2s;z-index:100;pointer-events:none;max-width:90%;text-align:center;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* イベントモーダル */
  #modal{position:fixed;inset:0;background:rgba(8,12,22,.78);display:none;align-items:center;justify-content:center;
    padding:20px;z-index:101;}
  #modal.show{display:flex;}
  .modalcard{background:var(--card);border:4px solid var(--ink);max-width:440px;width:100%;padding:18px;box-shadow:6px 6px 0 rgba(0,0,0,.5);
    animation:pop .18s steps(3);}
  @keyframes pop{from{transform:scale(.8)}to{transform:scale(1)}}
  .modalcard .ev-ico{font-size:40px;text-align:center;}
  .modalcard h3{text-align:center;margin:8px 0 10px;font-size:15px;font-weight:400;}
  .modalcard .ev-txt{font-size:12px;line-height:1.9;color:var(--ink);margin-bottom:14px;text-align:center;}

  .hint{font-size:10px;color:#6a6a55;line-height:1.7;margin-top:8px;text-align:center;}
  .footer{text-align:center;color:rgba(255,255,255,.7);font-size:9px;margin-top:14px;text-shadow:2px 2px 0 #0a2913;}
  .center{text-align:center;}
  .divline{height:3px;background:#c9c5a0;margin:14px 0;border-top:1px dashed var(--ink);}
  .seasonbadge{display:inline-block;background:#5a4a12;color:var(--gold);font-weight:400;font-size:10px;
    padding:3px 8px;border:2px solid var(--ink);}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="modal"><div class="modalcard" id="modalcard"></div></div>

<script>
"use strict";
/* =========================================================================
   フットボール・ソウル ～ココロで育てるサッカー育成譚～
   選手の「心理」がすべての成長量の倍率になる、新しいサッカー育成ゲーム。
   ========================================================================= */

const $ = sel => document.querySelector(sel);
const app = $("#app");
const rnd = (a,b)=> a + Math.random()*(b-a);
const irnd = (a,b)=> Math.floor(rnd(a,b+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const clamp = (v,a=0,b=100)=> Math.max(a,Math.min(b,v));
const round = v => Math.round(v);

/* ---- ドット絵スプライト生成 -------------------------------------------- */
const _sprCache = {};
function makeSprite(rows, pal){
  const H=rows.length, W=rows[0].length;
  const c=document.createElement("canvas"); c.width=W; c.height=H;
  const ctx=c.getContext("2d");
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const col=pal[rows[y][x]];
    if(col){ ctx.fillStyle=col; ctx.fillRect(x,y,1,1); }
  }
  return c.toDataURL();
}
function spriteTag(key, rows, pal, scale){
  if(!_sprCache[key]) _sprCache[key]=makeSprite(rows,pal);
  const W=rows[0].length, H=rows.length;
  return `<img class="spr" src="${_sprCache[key]}" alt="" width="${W*scale}" height="${H*scale}" style="width:${W*scale}px;height:${H*scale}px">`;
}
// 選手スプライト（12x14）。ユニフォーム色はポジションごと。
const PLAYER_ROWS = [
  "....kkkk....",
  "...khhhhk...",
  "..khhhhhhk..",
  "..ksssssk...",
  "..kEssEsk...",
  "..ksssssk...",
  "...kssssk...",
  "..kjjjjjjk..",
  ".kjjwwwwjjk.",
  ".kjjwNNwjjk.",
  "..kjjjjjjk..",
  "..kpp..ppk..",
  "..kpp..ppk..",
  "..bb....bb..",
];
const JERSEY = {FW:"#e23a3a", MF:"#3ddc62", DF:"#3a8de2", GK:"#ffcc33"};
function playerSprite(pos, scale=4){
  const pal={k:"#101024",h:"#5a3a1a",s:"#f1c08a",E:"#101024",
    j:JERSEY[pos]||"#3ddc62",w:"#ffffff",N:"#101024",p:"#2a2a40",b:"#111111"};
  return spriteTag("pl_"+pos, PLAYER_ROWS, pal, scale);
}
// サッカーボール（8x8）
const BALL_ROWS = [
  "..wwww..",
  ".wKwwKw.",
  "wwwKKwww",
  "wKKwwKKw",
  "wKKwwKKw",
  "wwwKKwww",
  ".wKwwKw.",
  "..wwww..",
];
function ballSprite(scale=7){
  return spriteTag("ball", BALL_ROWS, {w:"#ffffff",K:"#15162a"}, scale);
}

/* ---- データ定義 ---------------------------------------------------------- */
const STAT_KEYS = ["speed","power","tech","pass","shoot","defense","iq"];
const STAT_INFO = {
  speed:{n:"スピード",e:"⚡"}, power:{n:"フィジカル",e:"💪"}, tech:{n:"テクニック",e:"🎯"},
  pass:{n:"パス",e:"🅿️"}, shoot:{n:"シュート",e:"🥅"}, defense:{n:"ディフェンス",e:"🛡️"},
  iq:{n:"戦術IQ",e:"🧠"}
};

const POSITIONS = {
  FW:{n:"フォワード",key:["shoot","speed","tech"]},
  MF:{n:"ミッドフィルダー",key:["pass","iq","tech"]},
  DF:{n:"ディフェンダー",key:["defense","power","iq"]},
  GK:{n:"ゴールキーパー",key:["defense","power","iq"]}
};

// 性格タイプ。
//  love/hate … 練習の得意・苦手（練習相性）
//  crave     … 心が安定している時に"自然と欲しがる"声かけ（=その週の基準ニーズ）
//  ただし声かけの正解は固定ではなく、毎週の心理状態で動的に変わる（currentNeed参照）
const PERSONALITIES = {
  genius:{n:"天才肌",e:"✨",desc:"才能は本物。だが飽きっぽく、やる気が落ちやすい。挑戦的な課題で輝く。",
    pot:[78,95], motiDecay:1.6,
    love:["challenge"], hate:["routine"], crave:"dream", stressTough:0.9},
  hard:{n:"努力家",e:"🔥",desc:"コツコツ型。褒められ、認められると伸びる。安定して成長する。",
    pot:[66,84], motiDecay:0.7,
    love:["routine"], hate:[], crave:"praise", stressTough:1.05},
  rival:{n:"負けず嫌い",e:"⚔️",desc:"ライバルや厳しさを力に変える。甘やかすと腐る。",
    pot:[70,90], motiDecay:1.0,
    love:["challenge"], hate:["rest"], crave:"push", stressTough:1.15},
  glass:{n:"繊細な天才",e:"🌙",desc:"感受性が強く伸びしろ抜群。だが心が折れやすい。言葉選びが命。",
    pot:[80,98], motiDecay:1.2,
    love:["routine"], hate:["challenge"], crave:"together", stressTough:0.7},
  mood:{n:"ムードメーカー",e:"🎉",desc:"仲間想いで絆が育ちやすい。みんなと笑うと力が出る。",
    pot:[64,82], motiDecay:0.85,
    love:["routine"], hate:[], crave:"together", stressTough:1.1},
};

// 練習メニュー：targetへ成長。typeは声かけ相性判定にも使う。
const TRAININGS = [
  {id:"speed",  e:"⚡", n:"スピード練習",   d:"瞬発力とトップスピードを磨く", target:"speed",  type:"routine", stress:9},
  {id:"power",  e:"💪", n:"フィジカル強化", d:"体幹と当たり負けしない体に",   target:"power",  type:"routine", stress:11},
  {id:"tech",   e:"🎯", n:"基礎技術",       d:"トラップとボールタッチを反復", target:"tech",   type:"routine", stress:8},
  {id:"pass",   e:"🅿️", n:"パス練習",       d:"視野と展開力を養う",           target:"pass",   type:"routine", stress:7},
  {id:"shoot",  e:"🥅", n:"シュート練習",   d:"決定力をひたすら磨く",         target:"shoot",  type:"routine", stress:9},
  {id:"defense",e:"🛡️", n:"守備練習",       d:"対人と読みを鍛える",           target:"defense",type:"routine", stress:9},
  {id:"iq",     e:"🧠", n:"戦術ミーティング",d:"頭でサッカーを理解する",       target:"iq",     type:"challenge",stress:6},
  {id:"selfA",  e:"🌀", n:"自主練（猛特訓）",d:"高負荷。大きく伸びるが消耗大", target:"_random",type:"challenge",stress:20},
  {id:"rest",   e:"🛌", n:"休養日",         d:"心と体を回復させる",           target:"_rest",  type:"rest",     stress:-26},
];

// 声かけ：メンタルを動かす。type が性格の love/hate に当たると効果増減。
const TALKS = [
  {id:"praise",   e:"😊", n:"思いきり褒める",  d:"自信とやる気を引き上げる",      type:"praise",
    eff:{moti:9, conf:13, focus:0, stress:-6}, bond:2},
  {id:"push",     e:"😤", n:"厳しく要求する",  d:"集中を高めるが負担も大きい",    type:"push",
    eff:{moti:6, conf:-3, focus:14, stress:14}, bond:0},
  {id:"together", e:"🤝", n:"一緒に考える",    d:"対話で戦術IQと絆を育てる",      type:"together",
    eff:{moti:6, conf:6, focus:9, stress:-3}, bond:3, iqBonus:0.6},
  {id:"dream",    e:"🌟", n:"夢を語り合う",    d:"モチベーションを爆発させる",    type:"dream",
    eff:{moti:18, conf:5, focus:-2, stress:-2}, bond:2},
  {id:"rest",     e:"☕", n:"今日は休もう",    d:"ストレスを大きく癒やす",        type:"rest",
    eff:{moti:-4, conf:2, focus:0, stress:-18}, bond:1},
];

const OPP_NAMES = ["青嵐FC","セント・ロア","紅蓮ユナイテッド","白波SC","黒鉄ガンナーズ","蒼天イレブン",
  "雷鳴アスレチコ","碧波クラブ","暁ロヴァーズ","隼スポルティング","狼煙FC","海凪マリナーズ"];
const FIRST = ["ハル","レン","ソラ","カイ","リク","ツバサ","ジン","アサヒ","ユウ","タクミ","ハヤテ","ノア"];

// ステージ（昇格ラダー）。優勝すると上へ昇格し、潜在能力の上限が大きく開放される＝育成が伸び続ける。
const STAGES = [
  {n:"ユースチーム", e:"🌱", oppBase:40, mate:34, cap:72},
  {n:"3部リーグ",    e:"⚽", oppBase:52, mate:46, cap:80},
  {n:"2部リーグ",    e:"🔰", oppBase:62, mate:56, cap:86},
  {n:"1部リーグ",    e:"🏆", oppBase:72, mate:66, cap:92},

/* ---- ゲーム状態 ---------------------------------------------------------- */
let G = null;
function newGame(name, posKey){
  const pers = pick(Object.keys(PERSONALITIES));
  const P = PERSONALITIES[pers];
  const base = ()=> round(rnd(28,42));
  const stats = {}; STAT_KEYS.forEach(k=> stats[k]=base());
  // ポジション主要ステータスを少し底上げ
  POSITIONS[posKey].key.forEach((k,i)=> stats[k]=clamp(stats[k]+ (10-i*3)));
  // 才能（=この選手の地力）。各ステージの上限を才能ぶん底上げ／差し引きする。
  const talent = round(rnd(P.pot[0], P.pot[1]));
  const talentBonus = round((talent-80)/3);
  G = {
    name, pos:posKey, pers, talent, talentBonus,
    stage:0, potential: clamp(STAGES[0].cap + talentBonus, 50, 99),
    age:15, week:1, season:1,
    stats,
    mentals:{moti:62, conf:55, focus:55, stress:18},
    bond:0, fitness:100,
    matchIdx:0, results:[], goals:0, seasonGoals:0, momCount:0, careerGoals:0,
    nextMatchWeek:4, opp:null,
    awaken:false, injured:0,
    trophies:[], retired:false, won:false,
    log:[], pendingEvent:null, over:false,
    selTraining:null, selTalk:null,
  };
  rollOpponent();
  pushLog(`<span class="sys">— ${name}（${PERSONALITIES[pers].n}）の物語が始まる。まずは ${STAGES[0].n} で頭角を現せ。—</span>`);
  return G;
}

function rollOpponent(){
  const st = STAGES[G.stage];
  const diff = G.matchIdx*4 + irnd(-5,5);
  G.opp = { name:pick(OPP_NAMES), power: clamp(st.oppBase+diff, 28, 99) };
}

function ovr(){
  // 主要ステータス重視の総合値
  const key = POSITIONS[G.pos].key;
  let sum=0,w=0;
  STAT_KEYS.forEach(k=>{ const wt = key.includes(k)?2:1; sum+=G.stats[k]*wt; w+=wt; });
  return round(sum/w);
}

/* 心理倍率：成長量にかかる中核ロジック ---------------------------------- */
function mentalMultiplier(){
  const m=G.mentals;
  const tough = PERSONALITIES[G.pers].stressTough;
  const mul =
    (0.70 + 0.50*(m.moti/100)) *
    (0.80 + 0.35*(m.conf/100)) *
    (0.80 + 0.35*(m.focus/100)) *
    (1 - 0.45*(m.stress/100)/tough);
  return Math.max(0.4, mul);   // 不調≈0.4 / 平凡≈0.9 / 絶好調≈1.5
}

/* その週に選手が"いちばん欲しがっている声かけ" ---------------------------
   状態で動的に変わる。困っているメンタルを最優先で埋めようとする＝
   毎週、刺さる声かけが入れ替わる（性格固定ではない）。               */
function currentNeed(){
  const m=G.mentals;
  if(m.stress>=60) return "rest";     // 疲れ切っている → 休ませてほしい
  if(m.conf<=42)   return "praise";   // 自信喪失 → 認めてほしい
  if(m.moti<=44)   return "dream";    // 気持ちが乗らない → 目的を思い出したい
  if(m.focus<=44)  return "push";     // 緩んでいる → 引き締めてほしい
  if(m.stress>=42) return "together"; // 少し溜まってきた → 寄り添ってほしい
  return PERSONALITIES[G.pers].crave; // 安定時は性格ごとの"好み"
}
const NEED_BUBBLE = {
  rest:    "正直、ちょっと疲れが溜まってます…",
  praise:  "俺なんて、まだまだですよね…",
  dream:   "なんのために頑張ってるんだっけ、って思う日があって。",
  push:    "気が緩んでる自覚、あるんです。",
  together:"最近どう動けばいいか、ひとりだと迷っちゃって。",
};
const NEED_GOOD = {
  genius:"今すごく調子いいです！もっと難しいこと、やりたい。",
  hard:  "やれるだけやります。見ててください！",
  rival: "次の相手、絶対に負けたくないっす。",
  glass: "…なんか今日は、落ち着いてやれそうな気がします。",
  mood:  "みんなと練習するの、やっぱ楽しいっす！",
};
function needBubble(){
  const n=G.curNeed;
  if(NEED_BUBBLE[n]) return NEED_BUBBLE[n];
  return NEED_GOOD[G.pers] || "今日も頑張ります！";
}

/* 声かけの結果を一元計算（プレビューと実処理で共通利用） */
function talkOutcome(talk){
  const m=G.mentals, P=PERSONALITIES[G.pers], need=G.curNeed;
  let factor=1, backfire=false, matched=false, waste=false;
  if(talk.type==="push" && m.stress>=64){ backfire=true; }
  else {
    if(talk.type===need){ matched=true; factor=1.5; }
    if(P.crave===talk.type){ factor+=0.15; }
    if(talk.type==="rest" && m.stress<=22){ waste=true; factor=0.4; }
  }
  let d;
  if(backfire){ d={moti:-6,conf:-8,focus:4,stress:16}; }
  else {
    const e=talk.eff;
    d={ moti:e.moti*factor, conf:e.conf*factor, focus:e.focus*factor,
        stress:e.stress*(factor>1?0.7:1) };
  }
  return {d, factor, backfire, matched, waste, bond:(talk.bond||0)*(matched?1.6:1)};
}

/* 今週の概算成長量（randomは中央値で固定計算） */
function estimateGrowth(train, matched){
  const P=PERSONALITIES[G.pers];
  if(train.target==="_rest") return [];
  let trainMul=1;
  if(P.love.includes(train.type)) trainMul=1.25;
  if(P.hate.includes(train.type)) trainMul=0.75;
  const fitMul=0.6+0.4*(G.fitness/100);
  const mul=mentalMultiplier();
  const respond = matched?1.12:1;
  const keys = train.target==="_random" ? null : [train.target];
  const calc = tk=>{
    const head=clamp((G.potential-G.stats[tk])/G.potential,0,1);
    let g=3.55*mul*trainMul*fitMul*(0.5+0.5*head)*respond;
    if(G.awaken) g*=1.4;
    return Math.max(0.4,g);
  };
  if(!keys) return [{k:"?",amt:3.55*mul*trainMul*fitMul*respond}]; // 自主練=ランダム
  if(train.id==="iq" && G.selTalk==="together") return [{k:"iq",amt:calc("iq")*1.6}];
  return keys.map(tk=>({k:tk,amt:calc(tk)}));
}

  const train = TRAININGS.find(x=>x.id===G.selTraining);
  const talk  = TALKS.find(x=>x.id===G.selTalk);
  let gh="", mh="";
  if(talk){
    // 声かけの"素の傾向"だけを表示（刺さるかどうかは本音を読んで自分で判断）
    const parts=[];
    [["moti","やる気"],["conf","自信"],["focus","集中"],["stress","ストレス"]].forEach(([k,n])=>{
      const v=talk.eff[k]; if(Math.abs(v)<0.5) return;
      const good = (k==="stress") ? v<0 : v>0;
      parts.push(`<span class="${good?'up':'dn'}">${n}${v>0?'+':''}${v}</span>`);
    });
    mh = parts.join(" / ");

  if(train){
    const gs=estimateGrowth(train, false); // 概算は標準ケースで表示
    if(train.target==="_rest") gh=`<span class="up">🛌 コンディション回復・ストレス大幅減</span>`;
    else if(gs.length && gs[0].k==="?") gh=`<span class="gain">⁇ ランダムな能力が ≈+${gs[0].amt.toFixed(1)} ×2か所（高負荷）</span>`;
    else gh = gs.map(g=>`<span class="gain">${STAT_INFO[g.k].e}${STAT_INFO[g.k].n} ≈+${g.amt.toFixed(1)}</span>`).join(" / ");
  }
  box.innerHTML = `<div class="preview"><div class="ttl">▶ 予想される一週間（おおよそ）</div>
    ${gh?`<div>📈 成長：${gh}</div>`:''}

    ${!gh&&!mh?'<span class="empty">もう片方も選ぶと全体が見えます。</span>':''}
  </div>`;
}

/* =========================================================================
   1週間を進める処理
   ========================================================================= */
function advanceWeek(){
  if(!G.selTraining || !G.selTalk){ toast("練習と声かけを両方えらんでね"); return; }
  if(G.injured>0){ /* 離脱中は練習不可・回復のみ */ }

  const P = PERSONALITIES[G.pers];
  const talk = TALKS.find(x=>x.id===G.selTalk);
  const train = TRAININGS.find(x=>x.id===G.selTraining);
  pushLog(`<span class="sys">▼ 第${G.season}-${G.week}週</span>`);

  /* --- 声かけ（メンタル変化）：その週のニーズで効果が動的に変わる --- */
  const o = talkOutcome(talk);
  G.mentals.moti  = clamp(G.mentals.moti  + o.d.moti);
  G.mentals.conf  = clamp(G.mentals.conf  + o.d.conf);
  G.mentals.focus = clamp(G.mentals.focus + o.d.focus);
  G.mentals.stress= clamp(G.mentals.stress+ o.d.stress);
  G.bond = clamp(G.bond + o.bond, 0, 100);
  G.responded = o.matched; // 心が満たされた週は練習の吸収UP
  if(o.backfire) pushLog(`💬「${talk.n}」… <span class="bad">ストレスが限界の${G.name}には逆効果だった。</span>`);
  else if(o.matched) pushLog(`💬「${talk.n}」 <span class="good">今いちばん欲しい言葉だった。深く届いた！</span>`);
  else if(o.waste) pushLog(`💬「${talk.n}」 <span class="sys">…まあ、悪くはないか。</span>`);
  else pushLog(`💬「${talk.n}」`);

  /* --- 練習（ステータス成長） --- */
  const mul = mentalMultiplier();
  if(G.injured>0){
    pushLog(`<span class="sys">${G.name}は離脱中。リハビリで回復に努めた。</span>`);
    G.fitness = clamp(G.fitness + 18);
    G.mentals.stress = clamp(G.mentals.stress - 8);
    G.injured--;
    if(G.injured===0) pushLog(`<span class="good">復帰！ピッチに戻ってきた。</span>`);
  } else {
    let trainMul = 1;
    if(P.love.includes(train.type)) trainMul = 1.25;
    if(P.hate.includes(train.type)) trainMul = 0.75;
    // コンディション補正
    const fitMul = 0.6 + 0.4*(G.fitness/100);

    if(train.target==="_rest"){
      G.fitness = clamp(G.fitness + 24);
      G.mentals.stress = clamp(G.mentals.stress + train.stress); // -26
      G.mentals.conf = clamp(G.mentals.conf+2);
      pushLog(`🛌 しっかり休養。<span class="good">コンディションとストレスが回復した。</span>`);
    } else {
      // 成長対象決定
      let targets = [];
      if(train.target==="_random"){
        targets = [pick(STAT_KEYS), pick(STAT_KEYS)];
      } else {
        targets = [train.target];
        // 戦術ミーティング+一緒に考える のシナジー
        if(train.id==="iq" && talk.iqBonus) targets.push("iq");
      }
      const room = ()=> 1; // 伸びしろ概念は cap で表現
      const respond = G.responded ? 1.12 : 1; // 声かけが刺さった週は吸収UP
      targets.forEach(tk=>{
        const cur = G.stats[tk];
        const headroom = clamp((G.potential - cur)/G.potential, 0, 1); // capに近いほど伸びにくい
        let gain = rnd(2.8,4.3) * mul * trainMul * fitMul * (0.5 + 0.5*headroom) * respond;
        if(G.awaken) gain *= 1.4;
        gain = Math.max(0.6, gain);
        G.stats[tk] = clamp(cur + gain, 0, G.potential);
        pushLog(`${STAT_INFO[tk].e} ${STAT_INFO[tk].n} <span class="gain">+${gain.toFixed(1)}</span>（→${round(G.stats[tk])}）`);
      });
      G.fitness = clamp(G.fitness - (train.stress*0.5));
      G.mentals.stress = clamp(G.mentals.stress + train.stress);
      G.mentals.focus = clamp(G.mentals.focus + (train.type==="challenge"?3:1));
      if(mul<0.7) pushLog(`<span class="bad">心が乱れていて、練習が身に入らない…</span>`);
      else if(mul>=1.2) pushLog(`<span class="good">最高の集中！ぐんぐん吸収していく。</span>`);
    }
  }

  /* --- 自然変化（やる気の自然減衰・覚醒判定） --- */
  G.mentals.moti = clamp(G.mentals.moti - 2.2*P.motiDecay);
  G.mentals.focus = clamp(G.mentals.focus - 1.5);
  G.mentals.stress = clamp(G.mentals.stress - 1.5); // 時間経過で少し癒える
  checkAwaken();

  G.selTraining=null; G.selTalk=null;
  G.week++;

  /* --- 試合判定 --- */
  if(G.week > G.nextMatchWeek){
    // (進めた週が試合週を越えたら試合)
  }
  if(G.week-1 >= G.nextMatchWeek){
    // すでに上で week++ したので調整
  }

  /* --- ランダムイベント --- */
  const ev = rollEvent();
  if(ev){ render(); openEvent(ev); return; }

  // 試合週か？
  if(G.nextMatchWeek <= G.week-1){
    render();
    playMatch();
    return;
  }

  // シーズン終了判定
  if(G.week > 13){
    render();
    endSeason();
    return;
  }
  render();
}

/* 覚醒：心が満ちると一時的に成長UP */
function checkAwaken(){
  const m=G.mentals;
  if(!G.awaken && m.moti>82 && m.conf>78 && m.focus>75 && m.stress<22){
    G.awaken=true; G.awakenTimer=3;
    pushLog(`<span class="ev">✨ ${G.name}が"ゾーン"に入った！しばらく成長が加速する。</span>`);
    showModal("✨","覚醒 —Football Soul—",
      `${G.name}の心が完全に整った。<br>練習のすべてが力に変わる「ゾーン」状態に突入！<br><span style="color:#159a52;font-weight:800">これから3週間、成長量が大きく上昇する。</span>`,
      [{t:"いくぞ！",cls:"btn",fn:closeModal}]);
  } else if(G.awaken){
    G.awakenTimer--;
    if(G.awakenTimer<=0){ G.awaken=false; pushLog(`<span class="sys">ゾーンが解けた。</span>`); }
  }
}

/* =========================================================================
   ランダムイベント
   ========================================================================= */
function rollEvent(){
  if(G.pendingEvent) return null;
  const m=G.mentals;
  const r=Math.random();
  // スランプ：ストレス高
  if(m.stress>72 && r<0.55){
    return {
      ico:"💢", title:"スランプの兆し",
      txt:`${G.name}の表情が暗い。「…最近、ボールが重く感じるんです」<br>ストレスが限界に近い。どう接する？`,
      opts:[
        {t:"無理にでも練習させる", fn:()=>{ G.mentals.stress=clamp(m.stress+10); G.mentals.conf=clamp(m.conf-12);
          if(Math.random()<0.4){ injure(); } pushLog(`<span class="bad">無理が祟った…状態が悪化した。</span>`); }},
        {t:"数日オフをあげる", fn:()=>{ G.mentals.stress=clamp(m.stress-30); G.mentals.moti=clamp(m.moti-4);
          G.bond=clamp(G.bond+3); pushLog(`<span class="good">心が軽くなった。ストレスが大きく抜けた。</span>`); }},
        {t:"とことん話を聞く", fn:()=>{ G.mentals.stress=clamp(m.stress-18); G.mentals.conf=clamp(m.conf+8);
          G.bond=clamp(G.bond+6); pushLog(`<span class="good">${G.name}「聞いてくれて、ありがとう」絆が深まった。</span>`); }},
      ]
    };
  }
  // ライバル出現
  if(r<0.14){
    const riv = pick(FIRST)+"（"+pick(OPP_NAMES)+"）";
    return {
      ico:"⚔️", title:"ライバル出現",
      txt:`同世代の注目株 <b>${riv}</b> が頭角を現した。<br>${G.name}はどう反応する？`,
      opts:[
        {t:"「絶対に負けない」と燃やす", fn:()=>{
          const P=PERSONALITIES[G.pers];
          if(P.type==="rival"||G.pers==="rival"||G.pers==="genius"){ G.mentals.moti=clamp(m.moti+22); G.mentals.focus=clamp(m.focus+12);
            pushLog(`<span class="good">闘志に火がついた！やる気と集中が急上昇。</span>`);}
          else{ G.mentals.moti=clamp(m.moti+12); G.mentals.stress=clamp(m.stress+8);
            pushLog(`やる気は上がったが、少しプレッシャーも…`);}
        }},
        {t:"「人は人」とマイペースを保つ", fn:()=>{ G.mentals.stress=clamp(m.stress-6); G.mentals.focus=clamp(m.focus+4);
          pushLog(`<span class="sys">${G.name}は動じない。自分の道を行く。</span>`); }},
      ]
    };
  }
  // スカウト/メディア（実力高い時）
  if(ovr()>62 && r<0.12){
    return {
      ico:"📺", title:"メディアの注目",
      txt:`地元紙が ${G.name} を「次世代の逸材」と報じた。注目が集まっている。`,
      opts:[
        {t:"誇りに思う（自信UP）", fn:()=>{ G.mentals.conf=clamp(m.conf+14); G.mentals.moti=clamp(m.moti+8);
          if(G.pers==="glass"){ G.mentals.stress=clamp(m.stress+10); pushLog(`期待が少し重荷にも…`);}
          pushLog(`<span class="good">自信がみなぎる。</span>`); }},
        {t:"気を引き締める（集中UP）", fn:()=>{ G.mentals.focus=clamp(m.focus+12); G.mentals.stress=clamp(m.stress+4);
          pushLog(`<span class="good">浮かれず、足元を見つめ直した。</span>`); }},
      ]
    };
  }
  // 偶然の閃き
  if(r<0.10){
    const tk=pick(STAT_KEYS);
    return {
      ico:"💡", title:"閃きの瞬間",
      txt:`練習中、${G.name}が何かを掴んだ表情を見せた。「今の…わかった気がする！」`,
      opts:[
        {t:"その感覚を伸ばす", fn:()=>{ const g=rnd(3,6); G.stats[tk]=clamp(G.stats[tk]+g,0,G.potential);
          G.mentals.conf=clamp(m.conf+6); pushLog(`<span class="gain">${STAT_INFO[tk].n} +${g.toFixed(1)}！</span>ひらめきが力になった。`); }},
      ]
    };
  }
  return null;
}

function injure(){
  G.injured = irnd(2,3);
  G.fitness = clamp(G.fitness-30);
  G.mentals.stress = clamp(G.mentals.stress+10);
  pushLog(`<span class="bad">🩹 ${G.name}が負傷…${G.injured}週間の離脱。</span>`);
}

function openEvent(ev){
  G.pendingEvent = ev;
  showModal(ev.ico, ev.title, ev.txt,
    ev.opts.map(o=>({t:o.t, cls:"btn ghost", fn:()=>{ o.fn(); G.pendingEvent=null; closeModal(); afterEventFlow(); }}))
  );
}
function afterEventFlow(){
  // イベント後に試合・シーズン終了が控えていれば処理
  if(G.nextMatchWeek <= G.week-1){ render(); playMatch(); return; }
  if(G.week>13){ render(); endSeason(); return; }
  render();
}

/* =========================================================================
   試合シミュレーション
   ========================================================================= */
function playMatch(){
  const opp = G.opp;
  const key = POSITIONS[G.pos].key;
  // チーム力 = 選手の主要ステータス平均 × 心理 + チームメイト補正(固定+季節)
  const playerPow = key.reduce((s,k)=>s+G.stats[k],0)/key.length;
  const m=G.mentals;
  const psy = (0.7 + 0.3*(m.conf/100)) * (0.8+0.2*(m.focus/100)) * (1-0.3*(m.stress/100));
  const teammate = STAGES[G.stage].mate + G.bond*0.12;
  let ourPow = (playerPow*1.15*psy + teammate)/2;
  if(G.awaken) ourPow*=1.12;
  if(G.injured>0) ourPow*=0.8; // 万全でない

  // 得点シミュレーション
  let our=0, their=0;
  const events=[];
  const drama = 6;
  let perf = 0; // 選手の活躍度
  for(let i=0;i<drama;i++){
    const min = irnd(i*15+1, i*15+15);
    const atk = Math.random()* (ourPow);
    const def = Math.random()* (opp.power);
    if(atk>def*1.08){
      our++;
      // 得点関与
      const involve = Math.random();
      if(G.pos==="FW" || (G.pos==="MF"&&involve<0.6)){
        if(involve<0.55){ events.push({m:min,t:`<span class="good">⚽ ${min}' ${G.name}のゴール！！</span>`}); G.goals++; G.seasonGoals++; G.careerGoals++; perf+=3; }
        else { events.push({m:min,t:`<span class="good">🅰️ ${min}' ${G.name}のアシスト！</span>`}); perf+=2; }
      } else if(G.pos==="DF"||G.pos==="GK"){
        events.push({m:min,t:`<span class="good">⚽ ${min}' 味方のゴール！ ${G.name}も攻撃参加</span>`}); perf+=1;
      } else {
        events.push({m:min,t:`<span class="good">⚽ ${min}' チームが先制点！</span>`}); perf+=1;
      }
    } else if(def>atk*1.12){
      // 失点 → 守備陣の見せ場 or 被弾
      if((G.pos==="DF"||G.pos==="GK") && Math.random()<0.55){
        events.push({m:min,t:`<span class="good">🛡️ ${min}' ${G.name}が決定機を阻止！</span>`}); perf+=2;
      } else {
        their++;
        events.push({m:min,t:`<span class="bad">💥 ${min}' 失点を許す…</span>`});
      }
    } else {
      if(Math.random()<0.4) events.push({m:min,t:`<span class="sys">${min}' 互いに譲らない攻防</span>`});
    }
  }
  events.sort((a,b)=>a.m-b.m);

  const win = our>their, draw = our===their;
  const resStr = win?"WIN":draw?"DRAW":"LOSE";
  G.results.push(resStr);
  if(perf>=3) G.momCount++;

  // 試合後メンタル変化
  const P=PERSONALITIES[G.pers];
  if(win){
    G.mentals.conf=clamp(m.conf+12); G.mentals.moti=clamp(m.moti+10); G.mentals.stress=clamp(m.stress-6);
  } else if(draw){
    G.mentals.conf=clamp(m.conf+2); G.mentals.stress=clamp(m.stress+2);
  } else {
    if(G.pers==="rival"){ G.mentals.moti=clamp(m.moti+14); G.mentals.stress=clamp(m.stress+6);}
    else { G.mentals.conf=clamp(m.conf-10); G.mentals.moti=clamp(m.moti-4); G.mentals.stress=clamp(m.stress+12);}
  }
  if(perf>=3){ G.mentals.conf=clamp(G.mentals.conf+8); G.bond=clamp(G.bond+3); }
  G.fitness=clamp(G.fitness-14);

  // 次の試合をセット
  G.matchIdx++;
  G.nextMatchWeek = G.nextMatchWeek + 4;
  const prevOpp = opp;
  rollOpponent();

  // 試合画面
  app.innerHTML = `
    <div class="topbar"><div class="logo">MATCH DAY<small>第${G.season}季 第${G.matchIdx}節</small></div>
      <span class="pill">第${G.week-1}週</span></div>
    <div class="matchscene">
      <div class="scoreboard">
        <div class="tm">${G.name}<br><small style="opacity:.7">のチーム</small></div>
        <div class="sc">${our}<small> - </small>${their}</div>
        <div class="tm">${prevOpp.name}<br><small style="opacity:.7">力 ${round(prevOpp.power)}</small></div>
      </div>
    </div>
    <div class="panel">
      <h2 class="section">試合実況</h2>
      <div class="log" style="max-height:none">
        <p class="sys">— キックオフ！ vs ${prevOpp.name} —</p>
        ${events.map(e=>`<p>${e.t}</p>`).join("")}
        <p class="sys">— 試合終了 —</p>
        <p style="font-size:15px;font-weight:800;color:${win?'#74f0a3':draw?'#ffd98a':'#ff9b9b'}">
          結果：${win?'勝利！🎉':draw?'引き分け':'敗戦…'} ${perf>=3?'　🏅'+G.name+' がマン・オブ・ザ・マッチ！':''}</p>
      </div>
    </div>
    <button class="btn alt" id="contBtn">育成にもどる ▶</button>
  `;
  $("#contBtn").onclick = ()=>{
    pushLog(`<span class="ev">⚽ vs ${prevOpp.name} ${our}-${their} ${win?'勝利':draw?'分け':'敗戦'}</span>`);
    if(G.week>13){ render(); endSeason(); return; }
    render();
  };
}

/* =========================================================================
   シーズン終了 → 次シーズン / 終幕
   ========================================================================= */
function endSeason(){
  const W=G.results.filter(r=>r==="WIN").length;
  const D=G.results.filter(r=>r==="DRAW").length;
  const L=G.results.filter(r=>r==="LOSE").length;
  const champion = W>=2;                       // 過半数勝利でリーグ制覇
  const st = STAGES[G.stage];
  const topStage = G.stage>=STAGES.length-1;
  const newTrophies=[];

  if(champion){
    newTrophies.push(`${st.n} 優勝`);
    if(G.seasonGoals>=4) newTrophies.push(`得点王（${G.seasonGoals}G）`);
    G.trophies.push(...newTrophies);
  }

  // 最高峰で優勝 → 世界一クライマックス（終幕）
  if(champion && topStage){
    G.won=true; G.over=true;
    showModal("🌍","世界の頂点へ —",
      `${G.name}は世界の舞台を制した。<br>かつて ${STAGES[0].n} で出会ったあの日から、いくつもの夜を越えて――<br>
       <span style="color:#159a52;font-weight:800">ついに、世界一。</span>`,
      [{t:"エンディングを見る ▶",cls:"btn",fn:()=>{ closeModal(); renderEnding(); }}]);
    return;
  }

  // 昇格処理 ＆ 潜在能力の開放
  const oldPot=G.potential;
  let promoMsg="";
  if(champion && !topStage){
    G.stage++;
    G.talentBonus += irnd(1,3);  // 経験による地力の伸び（限界突破）
    G.potential = clamp(STAGES[G.stage].cap + G.talentBonus, 50, 99);
    promoMsg = `<div style="margin:10px 0;padding:10px;background:#eafaf0;border-radius:10px">
      🎉 <b>${STAGES[G.stage].e} ${STAGES[G.stage].n} へ昇格！</b><br>
      新たな舞台で、潜在能力が <span style="color:#159a52;font-weight:800">${oldPot} → ${G.potential}</span> に開放された。<br>
      <span class="sys">伸びしろが一気に広がった。まだまだ強くなれる。</span></div>`;
  } else {
    // 残留：地力の微成長で頭打ちを防ぐ
    G.talentBonus += 1;
    G.potential = clamp(STAGES[G.stage].cap + G.talentBonus, 50, 99);
    promoMsg = `<div class="sys" style="margin:8px 0">優勝には届かず、${st.n} に残留。来季こそ昇格を狙おう。（潜在 ${oldPot}→${G.potential}）</div>`;
  }

  // 次シーズンへ
  G.age++; G.season++; G.week=1; G.results=[];
  G.nextMatchWeek=4; G.matchIdx=0; G.seasonGoals=0;
  G.fitness=100;
  G.mentals.stress=clamp(G.mentals.stress-20);
  G.mentals.moti=clamp(G.mentals.moti+10);
  rollOpponent();

  const trophyLine = newTrophies.length
    ? `<div style="color:#c98a00;font-weight:800;margin:6px 0">🏆 獲得：${newTrophies.join(" / ")}</div>` : "";

  const buttons=[{t:`第${G.season}季を始める ▶`,cls:"btn",fn:()=>{ closeModal(); render(); }}];
  // プロ（2部以上）に到達していれば、好きなタイミングで引退＝物語を締められる
  if(G.stage>=2 || G.season>=4){
    buttons.push({t:"ここで現役を引退する",cls:"btn ghost",fn:()=>{ closeModal(); G.retired=true; G.over=true; renderEnding(); }});
  }

  showModal(champion?"🏆":st.e, `第${G.season-1}季 終了 ・ ${st.n}`,
    `成績：<b>${W}勝 ${D}分 ${L}敗</b>　今季 ${G.seasonGoals}ゴール　🏅MOM ${G.momCount}回<br>
     ${trophyLine}${promoMsg}
     <span class="sys">${G.name}は ${G.age}歳になった。</span>`,
    buttons);
}

      <div class="head">
        <div class="face">${playerSprite(G.pos,4)}</div>
        <div class="who"><div class="nm">${G.name}</div>
          <div class="sub">${G.age}歳 ・ ${G.pos} ・ ${PERSONALITIES[G.pers].n}</div></div>
        <div class="ovr"><b>${o}</b><span>FINAL OVR</span></div>
      </div>
      <div class="ptags">
        <span class="ptag gold">到達 ${reached.e}${reached.n}</span>
        <span class="ptag">通算 ⚽${G.careerGoals}ゴール</span>
        <span class="ptag">🏅MOM ${G.momCount}回</span>
        <span class="ptag">絆 Lv.${Math.floor(G.bond/10)}</span>
      </div>
    </div>
    <div class="panel">
      <h2 class="section">獲得タイトル（${G.trophies.length}）</h2>
      <div class="ptags" style="padding:0">${trophyTags}</div>
    </div>
    <div class="panel">
      <h2 class="section">最終能力値</h2>
      <div class="grid2">
        <div>${["speed","power","tech","pass"].map(statBar).join("")}</div>
        <div>${["shoot","defense","iq"].map(statBar).join("")}</div>
      </div>
      <div class="divline"></div>
      <p style="font-size:13px;line-height:1.9;color:#33483c">${desc}</p>
    </div>
    <button class="btn" id="againBtn">新しい才能を育てる ▶</button>
    <p class="hint">同じ性格でも、かける言葉で結末は変わる。<br>次はどこまで登りつめる？</p>
    <div class="footer">Thank you for playing — Football Soul</div>
  `;
  $("#againBtn").onclick = ()=>{ G=null; render(); };

/* =========================================================================
   汎用UI

function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1700);
}
function showModal(ico,title,html,buttons){
  $("#modalcard").innerHTML = `
    <div class="ev-ico">${ico}</div>
    <h3>${title}</h3>
    <div class="ev-txt">${html}</div>
    <div class="choices" id="modalBtns"></div>`;
  const box=$("#modalBtns");
  buttons.forEach(b=>{
    const el=document.createElement("button");
    el.className=b.cls||"btn"; el.textContent=b.t; el.style.marginTop="0";
    el.onclick=b.fn; box.appendChild(el);
  });
  $("#modal").classList.add("show");
}
function closeModal(){ $("#modal").classList.remove("show"); }

/* 起動 */
render();
