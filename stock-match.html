<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockMatch ｜ ポートフォリオ恋愛マッチング</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root{
  --pink:#ff4d8d; --pink-d:#e63973; --blue:#3b82f6; --bg:#fdf2f8;
  --ink:#1f2937; --muted:#6b7280; --card:#ffffff; --line:#f0d9e6;
  --male:#3b82f6; --female:#ff4d8d;
}
body{
  font-family:'Hiragino Kaku Gothic ProN','Meiryo',system-ui,sans-serif;
  background:linear-gradient(160deg,#fdf2f8,#eef4ff);
  color:var(--ink); min-height:100vh;
}
header{
  background:linear-gradient(135deg,var(--pink),#ff7eb3);
  color:#fff; padding:16px 22px; box-shadow:0 4px 14px rgba(255,77,141,.3);
  position:sticky; top:0; z-index:10;
}
header h1{ font-size:1.25rem; font-weight:800; letter-spacing:.5px; display:flex; align-items:center; gap:8px;}
header .subtitle{ font-size:.74rem; opacity:.92; margin-top:3px;}

.tabs{ display:flex; gap:4px; padding:10px 18px 0; background:transparent; max-width:760px; margin:0 auto; }
.tab-btn{
  flex:1; padding:11px 6px; border:none; cursor:pointer; font-size:.82rem; font-weight:700;
  color:var(--muted); background:rgba(255,255,255,.55); border-radius:12px 12px 0 0; transition:.15s;
}
.tab-btn.active{ color:var(--pink-d); background:var(--card); box-shadow:0 -2px 8px rgba(0,0,0,.05); }

.main{ max-width:760px; margin:0 auto; padding:18px 16px 60px; }
.view{ display:none; }
.view.active{ display:block; animation:fade .3s ease; }
@keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

.card{
  background:var(--card); border-radius:16px; padding:20px;
  box-shadow:0 6px 20px rgba(0,0,0,.06); margin-bottom:16px;
}
.card h2{ font-size:1rem; margin-bottom:4px; }
.card .hint{ font-size:.76rem; color:var(--muted); margin-bottom:14px; line-height:1.5; }

label.field{ display:block; font-size:.78rem; font-weight:700; color:var(--muted); margin:12px 0 5px; }
input[type=text], input[type=number], select{
  width:100%; padding:11px 12px; border:2px solid #e9d3e0; border-radius:10px;
  font-size:.92rem; font-family:inherit; color:var(--ink); background:#fff; transition:.15s;
}
input:focus, select:focus{ outline:none; border-color:var(--pink); }

.gender-row{ display:flex; gap:10px; }
.gender-opt{
  flex:1; padding:12px; border:2px solid #e9d3e0; border-radius:12px; text-align:center;
  cursor:pointer; font-weight:800; font-size:.9rem; user-select:none; transition:.15s; background:#fff;
}
.gender-opt.sel-male{ border-color:var(--male); background:#eaf1ff; color:var(--male); }
.gender-opt.sel-female{ border-color:var(--female); background:#ffe9f1; color:var(--female); }

.holdings{ margin-top:6px; }
.holding-row{ display:flex; gap:8px; margin-bottom:8px; align-items:center; }
.holding-row input.ticker{ flex:1.4; text-transform:uppercase; }
.holding-row input.wt{ flex:1; }
.holding-row .pct{ font-size:.74rem; color:var(--muted); width:42px; text-align:right; }
.holding-row .del{
  border:none; background:#fbe3ec; color:var(--pink-d); width:32px; height:32px; border-radius:8px;
  cursor:pointer; font-size:1rem; font-weight:800; flex:none;
}
.presets{ display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 4px; }
.preset-chip{
  font-size:.72rem; padding:5px 10px; border-radius:99px; border:1px solid #e9d3e0;
  background:#fff; cursor:pointer; color:var(--muted); font-weight:600;
}
.preset-chip:hover{ background:#fff0f6; border-color:var(--pink); color:var(--pink-d); }

.btn{
  width:100%; padding:13px; border:none; border-radius:12px; font-size:.95rem; font-weight:800;
  cursor:pointer; transition:.15s; margin-top:14px;
}
.btn-primary{ background:linear-gradient(135deg,var(--pink),#ff7eb3); color:#fff; box-shadow:0 4px 12px rgba(255,77,141,.35); }
.btn-primary:hover{ filter:brightness(1.05); }
.btn-ghost{ background:#f3f4f6; color:var(--muted); }
.btn-add{ background:#fff0f6; color:var(--pink-d); border:1px dashed var(--pink); margin-top:4px; padding:10px; }

.style-badges{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.style-badge{ font-size:.7rem; font-weight:700; padding:4px 10px; border-radius:99px; background:#f0e6ff; color:#6d28d9; }

.empty{ text-align:center; color:var(--muted); font-size:.85rem; padding:30px 10px; line-height:1.6; }

.person{
  display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:14px;
  background:#fff; box-shadow:0 3px 10px rgba(0,0,0,.05); margin-bottom:10px; border-left:5px solid #ddd;
}
.person.male{ border-left-color:var(--male); }
.person.female{ border-left-color:var(--female); }
.avatar{
  width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:1.3rem; flex:none; color:#fff; font-weight:800;
}
.avatar.male{ background:linear-gradient(135deg,#3b82f6,#60a5fa); }
.avatar.female{ background:linear-gradient(135deg,#ff4d8d,#ff7eb3); }
.person .info{ flex:1; min-width:0; }
.person .nm{ font-weight:800; font-size:.95rem; }
.person .sub{ font-size:.74rem; color:var(--muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.person .del-p{ border:none; background:none; color:#cbb; cursor:pointer; font-size:1.1rem; padding:6px; }

.match-card{
  background:#fff; border-radius:16px; padding:16px; margin-bottom:14px;
  box-shadow:0 6px 18px rgba(0,0,0,.07); position:relative; overflow:hidden;
}
.match-head{ display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:6px; }
.match-person{ text-align:center; flex:1; }
.match-person .mp-av{ width:54px; height:54px; border-radius:50%; margin:0 auto 4px; display:flex; align-items:center; justify-content:center; font-size:1.5rem; color:#fff; }
.match-person .mp-nm{ font-weight:800; font-size:.86rem; }
.heart{ font-size:1.6rem; }
.score-ring{
  text-align:center; margin:6px 0 4px;
}
.score-num{ font-size:2.2rem; font-weight:900; line-height:1; }
.score-label{ font-size:.72rem; color:var(--muted); font-weight:700; letter-spacing:1px; }
.score-bar-wrap{ background:#f0e6ee; height:9px; border-radius:99px; overflow:hidden; margin:10px 4px 6px; }
.score-bar{ height:100%; border-radius:99px; background:linear-gradient(90deg,#ff4d8d,#ff9a3d); transition:width .6s; }
.match-reasons{ font-size:.78rem; color:#4b5563; line-height:1.65; margin-top:8px; }
.match-reasons .tag{ display:inline-block; background:#fff0f6; color:var(--pink-d); font-size:.68rem; font-weight:700; padding:2px 8px; border-radius:99px; margin:2px 3px 0 0; }
.shared{ font-size:.74rem; color:var(--muted); margin-top:6px; }
.shared b{ color:var(--pink-d); }

.rank-badge{ position:absolute; top:10px; right:12px; font-size:.7rem; font-weight:800; color:#b45309; background:#fef3c7; padding:3px 9px; border-radius:99px; }
.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
  background:#1f2937; color:#fff; padding:11px 20px; border-radius:99px; font-size:.84rem; font-weight:600;
  opacity:0; transition:.25s; z-index:50; pointer-events:none;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
.footnote{ font-size:.68rem; color:#b9a; text-align:center; margin-top:20px; line-height:1.6; }
</style>
</head>
<body>
<header>
  <h1>💖 StockMatch</h1>
  <div class="subtitle">あなたの株ポートフォリオで運命の相手を見つけよう</div>
</header>

<div class="tabs">
  <button class="tab-btn active" data-tab="register">✍️ 登録</button>
  <button class="tab-btn" data-tab="people">👥 参加者</button>
  <button class="tab-btn" data-tab="matches">💘 マッチ結果</button>
</div>

<div class="main">

  <!-- ============ 登録 ============ -->
  <section class="view active" id="view-register">
    <div class="card">
      <h2>プロフィール登録</h2>
      <p class="hint">名前・性別と、保有している株のポートフォリオを入力してください。<br>投資の好みが近いほど、相性スコアが上がります。</p>

      <label class="field">ニックネーム</label>
      <input type="text" id="f-name" placeholder="例：たろう" maxlength="20">

      <label class="field">性別</label>
      <div class="gender-row">
        <div class="gender-opt" id="g-male" data-g="male">♂ 男性</div>
        <div class="gender-opt" id="g-female" data-g="female">♀ 女性</div>
      </div>

      <label class="field">年齢（任意）</label>
      <input type="number" id="f-age" placeholder="例：28" min="18" max="99">

      <label class="field">保有銘柄とウェイト（保有比率・口数・金額どれでもOK）</label>
      <div class="presets" id="presets"></div>
      <div class="holdings" id="holdings"></div>
      <button class="btn btn-add" id="add-holding" type="button">＋ 銘柄を追加</button>

      <div class="style-badges" id="style-preview"></div>

      <button class="btn btn-primary" id="save-btn">💾 登録する</button>
    </div>
  </section>

  <!-- ============ 参加者 ============ -->
  <section class="view" id="view-people">
    <div class="card">
      <h2>参加者一覧 <span id="people-count" style="font-weight:400;color:var(--muted);font-size:.85rem;"></span></h2>
      <p class="hint">登録された投資家たち。ここからプロフィールを削除できます。</p>
      <div id="people-list"></div>
      <button class="btn btn-ghost" id="seed-btn" type="button">🎲 サンプル参加者を追加して試す</button>
      <button class="btn btn-ghost" id="clear-btn" type="button" style="color:#dc2626;">🗑 全データを削除</button>
    </div>
  </section>

  <!-- ============ マッチ結果 ============ -->
  <section class="view" id="view-matches">
    <div class="card">
      <h2>💘 相性ランキング</h2>
      <p class="hint">男女ペアのポートフォリオ相性をスコア化しました。スコアが高いほど投資の価値観がぴったり！</p>
      <div id="matches-list"></div>
    </div>
    <div class="footnote">
      ※ 本アプリは娯楽用です。算出される相性スコアは投資判断・交際の保証ではありません。<br>
      データはお使いのブラウザ内（localStorage）にのみ保存されます。
    </div>
  </section>

</div>

<div class="toast" id="toast"></div>

<script>
/* ===================== データ ===================== */
const STORE_KEY = 'stockmatch_people_v1';
let people = load();
let selectedGender = null;

/* 人気銘柄プリセット（ティッカー: セクター） */
const PRESETS = {
  'AAPL':'tech','MSFT':'tech','GOOGL':'tech','NVDA':'tech','META':'tech','AMZN':'tech','TSLA':'tech',
  '7203':'auto','6758':'tech','9984':'tech','8306':'finance','SPY':'index','VTI':'index','QQQ':'index',
  'JPM':'finance','KO':'dividend','JNJ':'dividend','VYM':'dividend','BTC':'crypto','ETH':'crypto'
};
const SECTOR_LABEL = {
  tech:'ハイテク', auto:'自動車', finance:'金融', index:'インデックス',
  dividend:'高配当', crypto:'暗号資産', other:'その他'
};

/* ===================== ユーティリティ ===================== */
function load(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY))||[]; }catch(e){ return []; } }
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(people)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1900);
}
function sectorOf(ticker){ return PRESETS[ticker.toUpperCase()] || 'other'; }

/* ===================== ポートフォリオ分析 ===================== */
/* 正規化したウェイトベクトル（ティッカー -> 比率）を返す */
function normalize(holdings){
  const v={}; let sum=0;
  holdings.forEach(h=>{
    const t=(h.ticker||'').toUpperCase().trim(); const w=Math.abs(parseFloat(h.weight))||0;
    if(!t||w<=0) return; v[t]=(v[t]||0)+w; sum+=w;
  });
  if(sum>0) for(const k in v) v[k]/=sum;
  return v;
}
/* セクター比率を返す */
function sectorMix(holdings){
  const v=normalize(holdings); const s={};
  for(const t in v){ const sec=sectorOf(t); s[sec]=(s[sec]||0)+v[t]; }
  return s;
}
/* 投資スタイルのラベルを推定 */
function styleTags(holdings){
  const s=sectorMix(holdings); const tags=[];
  const top=Object.entries(s).sort((a,b)=>b[1]-a[1])[0];
  if(top) tags.push(SECTOR_LABEL[top[0]]+'寄り');
  const tickers=Object.keys(normalize(holdings));
  if(tickers.length>=6) tags.push('分散投資派');
  else if(tickers.length>0 && tickers.length<=2) tags.push('集中投資派');
  if((s.crypto||0)>0.25 || (s.tech||0)>0.6) tags.push('攻めのグロース');
  if((s.dividend||0)>0.3 || (s.index||0)>0.4) tags.push('堅実インカム');
  return tags;
}
/* コサイン類似度（銘柄レベル） */
function cosine(a,b){
  let dot=0,na=0,nb=0; const keys=new Set([...Object.keys(a),...Object.keys(b)]);
  keys.forEach(k=>{ const x=a[k]||0,y=b[k]||0; dot+=x*y; });
  for(const k in a) na+=a[k]*a[k]; for(const k in b) nb+=b[k]*b[k];
  if(na===0||nb===0) return 0; return dot/(Math.sqrt(na)*Math.sqrt(nb));
}

/* 2人の相性スコア（0-100）と理由を算出 */
function compatibility(p1,p2){
  const v1=normalize(p1.holdings), v2=normalize(p2.holdings);
  const s1=sectorMix(p1.holdings), s2=sectorMix(p2.holdings);
  const tickerSim=cosine(v1,v2);           // 同じ銘柄を持っているか
  const sectorSim=cosine(s1,s2);           // 投資テーマが近いか

  // 共有銘柄
  const shared=Object.keys(v1).filter(t=>v2[t]).sort((a,b)=>(v2[b]+v1[b])-(v2[a]+v1[a]));

  // スコア合成：銘柄一致55% + セクター一致35% + 多様性ボーナス10%
  let base = tickerSim*0.55 + sectorSim*0.35;
  // 共有銘柄数ボーナス
  const sharedBonus = Math.min(shared.length,4)/4*0.10;
  let score = (base + sharedBonus)*100;

  // 年齢が近いと微加点
  if(p1.age && p2.age){
    const diff=Math.abs(p1.age-p2.age);
    if(diff<=3) score+=4; else if(diff<=6) score+=2; else if(diff>15) score-=4;
  }
  score=Math.max(2,Math.min(99,Math.round(score)));

  // 理由タグ
  const reasons=[];
  if(shared.length) reasons.push('共通銘柄 '+shared.length+'件');
  if(sectorSim>0.85) reasons.push('投資テーマが激似');
  else if(sectorSim>0.6) reasons.push('投資テーマが近い');
  const t1=p1.holdings.length, t2=p2.holdings.length;
  if(Math.abs(t1-t2)<=1) reasons.push('ポートフォリオの組み方が同じタイプ');
  if(p1.age&&p2.age&&Math.abs(p1.age-p2.age)<=3) reasons.push('年齢が近い');
  // 補完性：片方が攻め・片方が守りだと「バランス◎」
  const aggr=x=>(sectorMix(x.holdings).crypto||0)+(sectorMix(x.holdings).tech||0);
  if(Math.abs(aggr(p1)-aggr(p2))>0.5) reasons.push('攻めと守りでバランス補完');
  if(!reasons.length) reasons.push('これから価値観をすり合わせるタイプ');

  return { score, shared:shared.slice(0,5), reasons };
}

/* ===================== 登録フォーム ===================== */
function renderPresets(){
  const box=document.getElementById('presets'); box.innerHTML='';
  Object.keys(PRESETS).slice(0,12).forEach(t=>{
    const c=document.createElement('div'); c.className='preset-chip'; c.textContent=t;
    c.onclick=()=>addHolding(t,''); box.appendChild(c);
  });
}
function addHolding(ticker='', weight=''){
  const box=document.getElementById('holdings');
  const row=document.createElement('div'); row.className='holding-row';
  row.innerHTML=`
    <input class="ticker" type="text" placeholder="銘柄/ティッカー" value="${ticker}">
    <input class="wt" type="number" placeholder="比率/口数" min="0" step="any" value="${weight}">
    <span class="pct">–</span>
    <button class="del" type="button">×</button>`;
  row.querySelector('.del').onclick=()=>{ row.remove(); refreshForm(); };
  row.querySelectorAll('input').forEach(i=>i.addEventListener('input',refreshForm));
  box.appendChild(row);
  refreshForm();
}
function readForm(){
  const holdings=[];
  document.querySelectorAll('#holdings .holding-row').forEach(r=>{
    const t=r.querySelector('.ticker').value.trim();
    const w=r.querySelector('.wt').value;
    if(t) holdings.push({ticker:t, weight:w});
  });
  return holdings;
}
function refreshForm(){
  const holdings=readForm();
  const v=normalize(holdings);
  // % 表示更新
  document.querySelectorAll('#holdings .holding-row').forEach(r=>{
    const t=r.querySelector('.ticker').value.trim().toUpperCase();
    const span=r.querySelector('.pct');
    span.textContent = v[t]? Math.round(v[t]*100)+'%' : '–';
  });
  // スタイルプレビュー
  const sp=document.getElementById('style-preview'); sp.innerHTML='';
  styleTags(holdings).forEach(tg=>{ const b=document.createElement('span'); b.className='style-badge'; b.textContent='#'+tg; sp.appendChild(b); });
}

function bindGender(){
  document.querySelectorAll('.gender-opt').forEach(el=>{
    el.onclick=()=>{
      selectedGender=el.dataset.g;
      document.getElementById('g-male').className='gender-opt'+(selectedGender==='male'?' sel-male':'');
      document.getElementById('g-female').className='gender-opt'+(selectedGender==='female'?' sel-female':'');
    };
  });
}

function saveProfile(){
  const name=document.getElementById('f-name').value.trim();
  const age=parseInt(document.getElementById('f-age').value)||null;
  const holdings=readForm();
  if(!name){ toast('ニックネームを入力してね'); return; }
  if(!selectedGender){ toast('性別を選んでね'); return; }
  if(holdings.length===0){ toast('銘柄を1つ以上入れてね'); return; }
  people.push({ id:uid(), name, gender:selectedGender, age, holdings });
  save();
  // リセット
  document.getElementById('f-name').value='';
  document.getElementById('f-age').value='';
  document.getElementById('holdings').innerHTML='';
  document.getElementById('style-preview').innerHTML='';
  selectedGender=null; document.getElementById('g-male').className='gender-opt'; document.getElementById('g-female').className='gender-opt';
  addHolding();
  toast('🎉 '+name+' さんを登録しました！');
  switchTab('people');
}

/* ===================== 参加者一覧 ===================== */
function renderPeople(){
  const list=document.getElementById('people-list');
  document.getElementById('people-count').textContent='（'+people.length+'人）';
  if(people.length===0){ list.innerHTML='<div class="empty">まだ参加者がいません。<br>「登録」タブから追加するか、下のサンプルボタンを押してね。</div>'; return; }
  list.innerHTML='';
  people.forEach(p=>{
    const top=Object.entries(normalize(p.holdings)).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]).join(', ');
    const el=document.createElement('div'); el.className='person '+p.gender;
    el.innerHTML=`
      <div class="avatar ${p.gender}">${p.gender==='male'?'♂':'♀'}</div>
      <div class="info">
        <div class="nm">${esc(p.name)} ${p.age?'<span style="font-weight:400;color:#999;font-size:.8rem;">'+p.age+'歳</span>':''}</div>
        <div class="sub">📊 ${esc(top||'—')} ・ ${styleTags(p.holdings).map(t=>'#'+t).join(' ')}</div>
      </div>
      <button class="del-p" title="削除">🗑</button>`;
    el.querySelector('.del-p').onclick=()=>{ people=people.filter(x=>x.id!==p.id); save(); renderPeople(); toast('削除しました'); };
    list.appendChild(el);
  });
}

/* ===================== マッチ結果 ===================== */
function renderMatches(){
  const list=document.getElementById('matches-list');
  const males=people.filter(p=>p.gender==='male');
  const females=people.filter(p=>p.gender==='female');
  if(males.length===0||females.length===0){
    list.innerHTML='<div class="empty">男女それぞれ1人以上の登録が必要です。<br>（現在 男性'+males.length+'人 / 女性'+females.length+'人）</div>';
    return;
  }
  const pairs=[];
  males.forEach(m=>females.forEach(f=>{ const c=compatibility(m,f); pairs.push({m,f,...c}); }));
  pairs.sort((a,b)=>b.score-a.score);
  list.innerHTML='';
  pairs.forEach((pr,i)=>{
    const card=document.createElement('div'); card.className='match-card';
    const rank=i===0?'<div class="rank-badge">👑 ベストカップル</div>':(i<3?'<div class="rank-badge">★ TOP'+(i+1)+'</div>':'');
    const sharedHtml=pr.shared.length?'<div class="shared">🤝 共通銘柄：<b>'+pr.shared.map(esc).join(', ')+'</b></div>':'';
    card.innerHTML=`
      ${rank}
      <div class="match-head">
        <div class="match-person"><div class="mp-av avatar male">♂</div><div class="mp-nm">${esc(pr.m.name)}</div></div>
        <div class="heart">${pr.score>=70?'💖':pr.score>=45?'💗':'🩶'}</div>
        <div class="match-person"><div class="mp-av avatar female">♀</div><div class="mp-nm">${esc(pr.f.name)}</div></div>
      </div>
      <div class="score-ring">
        <div class="score-num" style="color:${scoreColor(pr.score)}">${pr.score}<span style="font-size:1rem">%</span></div>
        <div class="score-label">PORTFOLIO MATCH</div>
      </div>
      <div class="score-bar-wrap"><div class="score-bar" style="width:${pr.score}%"></div></div>
      <div class="match-reasons">${pr.reasons.map(r=>'<span class="tag">'+esc(r)+'</span>').join('')}</div>
      ${sharedHtml}`;
    list.appendChild(card);
  });
}
function scoreColor(s){ return s>=70?'#e63973':s>=45?'#f97316':'#9ca3af'; }

/* ===================== タブ ===================== */
function switchTab(name){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  if(name==='people') renderPeople();
  if(name==='matches') renderMatches();
}
document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));

/* ===================== サンプル / 削除 ===================== */
function seed(){
  const samples=[
    {name:'たくみ',gender:'male',age:29,holdings:[{ticker:'NVDA',weight:40},{ticker:'AAPL',weight:30},{ticker:'TSLA',weight:30}]},
    {name:'けんと',gender:'male',age:34,holdings:[{ticker:'VYM',weight:50},{ticker:'KO',weight:30},{ticker:'JNJ',weight:20}]},
    {name:'りょう',gender:'male',age:26,holdings:[{ticker:'BTC',weight:50},{ticker:'ETH',weight:30},{ticker:'NVDA',weight:20}]},
    {name:'さくら',gender:'female',age:27,holdings:[{ticker:'AAPL',weight:35},{ticker:'NVDA',weight:35},{ticker:'MSFT',weight:30}]},
    {name:'みお',gender:'female',age:31,holdings:[{ticker:'VTI',weight:40},{ticker:'VYM',weight:40},{ticker:'KO',weight:20}]},
    {name:'ゆい',gender:'female',age:24,holdings:[{ticker:'ETH',weight:40},{ticker:'BTC',weight:30},{ticker:'TSLA',weight:30}]},
  ];
  samples.forEach(s=>people.push({id:uid(),...s}));
  save(); renderPeople(); toast('サンプル6人を追加しました');
}
document.getElementById('seed-btn').onclick=seed;
document.getElementById('clear-btn').onclick=()=>{ if(confirm('全ての参加者データを削除しますか？')){ people=[]; save(); renderPeople(); toast('全削除しました'); } };

/* ===================== 初期化 ===================== */
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
document.getElementById('add-holding').onclick=()=>addHolding();
document.getElementById('save-btn').onclick=saveProfile;
renderPresets(); bindGender(); addHolding();
</script>
